# Extensions extend the built-in list and are deduplicated.
# Shell, Terraform, PEM/key, and JavaScript build artifacts are built in.
extensions = ["kt"]

# Present scalar sections replace their defaults.
[entropy]
enabled = true
threshold = 4.8
min_length = 30

# Exclusions extend the built-in list. The last matching rule wins.
[[exclusions]]
pattern = "**/node_modules/**"
policy = "Ignore"

[[exclusions]]
pattern = "**/test-fixtures/**"
policy = "ScanButAllow"

# This policy intentionally allows findings without failing CI.
[[exclusions]]
pattern = "docs/examples/**"
policy = "ScanButWarn"

# Stripe secret/restricted keys are already built in.
# Use a named secret capture to redact only the credential value.
[[patterns]]
name = "internal-service-token"
pattern = '''service_token\s*=\s*"(?P<secret>[A-Za-z0-9_-]{32,})"'''
description = "Internal service token"
severity = "High"

# A custom pattern with a built-in name replaces that rule's matching semantics.
# An empty revision list scans HEAD.
[git]
max_depth = 1000
branches = []
