name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo build --release
      - name: Self-scan with Redflag action
        uses: ./
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "redflag") | .version')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

  release-linux:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cross
      - run: cross build --release --target x86_64-unknown-linux-gnu
      - run: mkdir -p dist
      - run: cp target/x86_64-unknown-linux-gnu/release/redflag dist/redflag-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: dist/redflag-linux

  release-windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cross
      - run: cross build --release --target x86_64-pc-windows-gnu
      - run: mkdir -p dist
      - run: cp target/x86_64-pc-windows-gnu/release/redflag.exe dist/redflag-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: dist/redflag-windows.exe

  release-macos:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          targets: x86_64-apple-darwin
      - run: rustup target add x86_64-apple-darwin
      - run: cargo build --release --target x86_64-apple-darwin
      - run: mkdir -p dist
      - run: cp target/x86_64-apple-darwin/release/redflag dist/redflag-macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos-binary
          path: dist/redflag-macos

  create-release:
    needs: [release-linux, release-windows, release-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: macos-binary
          path: artifacts
      - uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.ref_name }}
          files: |
            artifacts/redflag-linux
            artifacts/redflag-windows.exe
            artifacts/redflag-macos
